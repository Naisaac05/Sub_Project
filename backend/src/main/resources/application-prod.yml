spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/devmatch?useSSL=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # 운영 기본은 validate(스키마 검증만). 최초 배포 1회만 JPA_DDL_AUTO=update 로 생성.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379

server:
  port: 8080
  # Caddy/ALB 뒤에서 X-Forwarded-* 를 신뢰해 HTTPS 스킴·호스트를 정확히 인식
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}

# 관리자 환불 — prod 는 실제 토스 API 호출
app:
  payment:
    # 학생 포트폴리오 정책: 승인·취소 모두 기본 false. 실호출이 필요할 때만 env 로 true + test 키 사용.
    # false 인 동안 승인된 결제는 paymentKey 가 MOCK- 로 시작하므로 실제 승인 건과 구분된다.
    toss-confirm-enabled: ${TOSS_CONFIRM_ENABLED:false}
    toss-cancel-enabled: ${TOSS_CANCEL_ENABLED:false}
  auth:
    refresh-cookie:
      # 운영은 HTTPS 전제 — REFRESH_COOKIE_SECURE 환경변수 누락과 무관하게 Secure 플래그를 항상 강제
      secure: true
