spring:
  application:
    name: devmatch

  # ===== Database (MySQL) =====
  datasource:
    url: jdbc:mysql://localhost:3307/devmatch?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD:adminuser}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ===== DB 마이그레이션 (Flyway) =====
  # 스키마 변경의 단일 창구. db/migration 의 V*.sql 을 순서대로 적용하고
  # flyway_schema_history 테이블에 이력을 남긴다.
  # baseline-on-migrate: 이미 테이블이 있는 기존 DB 는 V1(baseline) 을 "적용됨"으로 표시만 하고
  # 실행하지 않는다. 빈 DB(신규 환경)에서는 V1 이 실제로 스키마를 생성한다.
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  # ===== JPA / Hibernate =====
  jpa:
    hibernate:
      # validate — 스키마 생성/변경은 Flyway 담당, Hibernate 는 엔티티와 DB 가 맞는지 검사만 한다.
      # 어긋나면 기동이 중단되므로 "코드엔 있는데 DB 엔 없는" 상태가 구조적으로 불가능해진다.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
        "[default_batch_fetch_size]": 100

    open-in-view: false

  # ===== Redis =====
  data:
    redis:
      host: localhost
      port: 6379

  # ===== Google OAuth2 =====
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-client-secret}
            scope:
              - email
              - profile
              - https://www.googleapis.com/auth/calendar

# ===== Server =====
server:
  port: 8080

# ===== Observability =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  metrics:
    tags:
      application: ${spring.application.name}

# ===== JWT =====
jwt:
  secret: ${JWT_SECRET:devmatch_super_secret_jwt_key_that_is_long_enough}
  access-token-expiration: 3600000 # 1시간 (ms)
  refresh-token-expiration: 604800000 # 7일 (ms)

# ===== Auth Cookie / 관리자 환불 =====
app:
  auth:
    refresh-cookie:
      name: refresh_token
      path: /api/auth
      secure: ${REFRESH_COOKIE_SECURE:false} # 운영에서는 true (HTTPS)
      same-site: Strict
    reuse-window-seconds: 300 # 재사용 탐지 윈도우 (5분)
  payment:
    # 외부 토스 API 실호출 차단 플래그 — 승인/취소 모두 기본 false.
    # 학생 포트폴리오 정책상 실결제·실환불 금지. 실호출이 필요하면 test_ 접두사 키와 함께 true 로.
    # 승인이 false 면 토스 호출 없이 내부 상태만 CONFIRMED 로 두고 paymentKey 에 MOCK- 접두사를 남긴다.
    # 금액 검증은 이 플래그와 무관하게 항상 수행된다.
    toss-confirm-enabled: ${TOSS_CONFIRM_ENABLED:false}
    toss-cancel-enabled: ${TOSS_CANCEL_ENABLED:false}

  # 결제 대기열(Waiting Room). 기본 false — 켜면 결제 진입이 대기열을 거친다.
  # promote-batch-size / promote-interval-ms 의 비율이 하류로 흘리는 초당 처리량이 된다.
  waiting-queue:
    enabled: ${WAITING_QUEUE_ENABLED:false}
    promote-batch-size: ${WAITING_QUEUE_PROMOTE_BATCH_SIZE:100}
    promote-interval-ms: ${WAITING_QUEUE_PROMOTE_INTERVAL_MS:1000}
    active-ttl-seconds: ${WAITING_QUEUE_ACTIVE_TTL_SECONDS:300}

  cors:
    # 콤마 구분 다중 도메인 허용. 운영에서는 APP_CORS_ALLOWED_ORIGINS 로 배포 도메인 지정.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

  ai-review:
    enabled: ${AI_REVIEW_ENABLED:true}
    provider: ${AI_REVIEW_PROVIDER:PYTHON}
    candidates-path: ${AI_REVIEW_CANDIDATES_PATH:../ai/app/knowledge/candidates/course_concepts.jsonl}
    auto-candidates-path: ${AI_REVIEW_AUTO_CANDIDATES_PATH:../ai/app/knowledge/candidates/auto_candidates.jsonl}
    concepts-v2-path: ${AI_REVIEW_CONCEPTS_V2_PATH:../ai/app/knowledge/concepts_v2}
    streaming-enabled: ${AI_REVIEW_STREAMING_ENABLED:false}
    stream-timeout-seconds: ${AI_REVIEW_STREAM_TIMEOUT_SECONDS:120}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4.1-mini}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1/responses}
      temperature: ${OPENAI_TEMPERATURE:0.2}
    python:
      enabled: ${PYTHON_AI_ENABLED:true}
      base-url: ${PYTHON_AI_BASE_URL:http://localhost:8001}
      model: ${PYTHON_AI_MODEL:exaone3.5:2.4b}
      temperature: ${PYTHON_AI_TEMPERATURE:0.2}
      max-tokens: ${PYTHON_AI_MAX_TOKENS:256}
      num-ctx: ${PYTHON_AI_NUM_CTX:1024}
      num-thread: ${PYTHON_AI_NUM_THREAD:4}
      read-timeout-seconds: ${PYTHON_AI_READ_TIMEOUT_SECONDS:30}
      service-token: ${AI_REVIEW_SERVICE_TOKEN:}
    ollama:
      enabled: ${OLLAMA_ENABLED:true}
      model: ${OLLAMA_MODEL:exaone3.5:2.4b}
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      temperature: ${OLLAMA_TEMPERATURE:0.2}
      max-tokens: ${OLLAMA_MAX_TOKENS:256}
      num-ctx: ${OLLAMA_NUM_CTX:1024}
      num-thread: ${OLLAMA_NUM_THREAD:4}
      read-timeout-seconds: ${OLLAMA_READ_TIMEOUT_SECONDS:30}
      max-concurrent-generations: ${OLLAMA_MAX_CONCURRENT_GENERATIONS:1}
    evaluation:
      semantic-enabled: ${AI_REVIEW_SEMANTIC_EVALUATION_ENABLED:false}
    degraded:
      streaming-off: ${AI_REVIEW_STREAMING_OFF:false}
    rate-limit:
      enabled: ${AI_REVIEW_RATE_LIMIT_ENABLED:true}
      per-user-per-minute: ${AI_REVIEW_RATE_LIMIT_PER_USER_PER_MINUTE:12}
      per-ip-per-minute: ${AI_REVIEW_RATE_LIMIT_PER_IP_PER_MINUTE:60}
      window-seconds: ${AI_REVIEW_RATE_LIMIT_WINDOW_SECONDS:60}
    rule-based:
      enabled: ${AI_REVIEW_RULE_BASED_ENABLED:true}
    limits:
      max-questions-per-wrong-answer: ${AI_REVIEW_MAX_QUESTIONS_PER_WRONG_ANSWER:3}
      max-questions-per-session: ${AI_REVIEW_MAX_QUESTIONS_PER_SESSION:10}
      max-user-answer-length: ${AI_REVIEW_MAX_USER_ANSWER_LENGTH:700}

    # 🧪 테스트 전용: AI 리뷰 세션 초기화 엔드포인트
    # 운영 환경에서는 절대 true 로 설정하지 말 것. 기본값 false.
    test-reset:
      enabled: ${AI_REVIEW_TEST_RESET_ENABLED:false}

# ===== Swagger =====
springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ===== 토스페이먼츠 =====
toss:
  payments:
    secret-key: ${TOSS_SECRET_KEY:test_sk_your_key}
    client-key: ${TOSS_CLIENT_KEY:test_ck_your_key}
    base-url: https://api.tosspayments.com/v1

# ===== Google Calendar =====
google:
  calendar:
    credentials-path: ${GOOGLE_CREDENTIALS_PATH:classpath:google-credentials.json}
    application-name: DevMatch

# ===== File Upload =====
# 업로드 저장 경로. 운영(컨테이너)에서는 FILE_UPLOAD_DIR 로 영속 볼륨 경로 지정.
file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}
