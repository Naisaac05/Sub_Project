spring:
  datasource:
    url: jdbc:h2:mem:devmatch-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        "[dialect]": org.hibernate.dialect.H2Dialect
        "[format_sql]": false
