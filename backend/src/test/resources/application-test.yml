spring:
  datasource:
    url: jdbc:h2:mem:devmatch-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  # 테스트 스키마는 아래 ddl-auto: create-drop 으로 엔티티에서 생성한다.
  # 마이그레이션(db/migration)은 MySQL 전용 DDL 이라 H2 에서 실행되지 않아야 한다.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        "[dialect]": org.hibernate.dialect.H2Dialect
        "[format_sql]": false
